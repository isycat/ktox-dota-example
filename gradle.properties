# This project requires JDK 21.
# If Java 21 is not your system default, set JAVA_HOME to your JDK 21 installation
# before running Gradle, or add the following to ~/.gradle/gradle.properties:
#   org.gradle.java.home=/path/to/jdk-21

# Metaspace was capped at 1g and the daemon kept exhausting it → daemon restart → slow rebuilds. The
# transpiler + Kotlin PSI + compiler load a lot of classes; give them room so the daemon survives builds.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g
# Run independent subproject tasks concurrently — :lua (transpileKotlinToLua) and :panorama
# (transpileKotlinToV8Js) are independent, so they should transpile in parallel, not one after the other.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# ---------------- Version constants ----------------
# Kotlin version used across all subprojects.
kotlinVersion=2.3.10

# Version of the ktox tool suite (core: even versions). Local build under verification.
ktoxSuiteVersion=local-0.4.0.109

# Version of ktox-dota, ktox-dota-lib, lua types, panorama types (dota: odd versions).
ktoxDotaVersion=local-0.4.1.110
dotaPanoramaTypesVersion=local-0.4.1.110

# ---------------------------------------------------
