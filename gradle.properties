# This project requires JDK 21.
# If Java 21 is not your system default, set JAVA_HOME to your JDK 21 installation
# before running Gradle, or add the following to ~/.gradle/gradle.properties:
#   org.gradle.java.home=/path/to/jdk-21

# kotlin-compiler-embeddable is an intentional implementation dependency of the
# ktox-lua Gradle plugin (needed for PSI-based Kotlin source parsing).
# Suppress the KGP warning about KCE being on the build classpath.
kotlin.suppressGradlePluginWarnings=KotlinCompilerEmbeddableIsPresentInClasspath


# ------ Version constants ------
# Kotlin version used across all subprojects.
kotlinVersion=2.3.10
# Version of the com.isycat.dota:lua-types library.
dotaLuaTypesVersion=0.0.13
# Version of the com.isycat.dota:panorama-types library and the
# com.isycat.ktox:dota-panorama-layout-dsl / panorama-layout-kts DSL libraries.
dotaPanoramaTypesVersion=0.0.13
