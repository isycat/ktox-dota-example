ktoxSuiteVersion=local-0.3.8.98

# Version of ktox-dota, ktox-dota-lib, lua types, panorama types (dota: odd versions).
ktoxDotaVersion=local-0.3.7.128
dotaPanoramaTypesVersion=local-0.3.7.128

